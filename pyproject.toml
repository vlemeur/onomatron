[project]
name = "onomatron"
version = "0.2.0"
description = "Character-level generation of French literature character names, makemore-style, up to a from-scratch decoder-only transformer in PyTorch"
readme = "README.md"
authors = [
    { name = "Vincent Le Meur", email = "vincent.lemeur@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anywidget>=0.11.0",
    "huggingface_hub>=0.30.0",
    "jinja2>=3.1.0",
    "mlflow>=3.18.0",
    "mwparserfromhell>=0.7.2",
    "numpy>=2.5.5",
    "optuna>=5.1.0",
    "plotly>=7.1.0",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "tenacity>=9.2.1",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["onomatron", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/onomatron"]
# Network-only code: not covered by the offline test suite (fetch.py talks to
# Wikipedia/Wikidata/HF, publish/ to the Hub) — mock them before measuring.
omit = ["*/scraper/fetch.py", "*/publish/*"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "streamlit>=1.40.0",
    "ty>=0.0.97",
]

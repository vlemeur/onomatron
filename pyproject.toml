[project]
name = "onomatron"
version = "0.1.0"
description = "Character-level generation of French literature character names, makemore-style, up to a from-scratch decoder-only transformer in PyTorch"
readme = "README.md"
authors = [
    { name = "Vincent Le Meur", email = "vincent.lemeur@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mwparserfromhell>=0.7.2",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "tenacity>=9.2.1",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["onomatron", "tests"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "prek>=0.5.10",
    "ruff>=0.17.3",
    "ty>=0.0.97",
]
